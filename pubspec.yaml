name: unified_popups
description: >-
  Unified Overlay popup system for Flutter: toast, loading, confirm, date,
  sheet, flow sheet, menu and drop menu. One Pop API, no BuildContext,
  shared back and route policies.
version: 2.0.1
homepage: https://github.com/xinqingaa/unified_popups
repository: https://github.com/xinqingaa/unified_popups
issue_tracker: https://github.com/xinqingaa/unified_popups/issues

topics:
  - dialog
  - toast
  - overlay
  - popup
  - bottomsheet

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
